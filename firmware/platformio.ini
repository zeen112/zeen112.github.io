; StopLamp firmware v2 - ESP32 (DevKit) + sampai 4 strip LED
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = default.csv
lib_deps =
    fastled/FastLED@^3.7.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
