; StopLamp firmware v2.1 - ESP32-C3 (USB-C built-in) + sampai 8 strip LED
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = default.csv
lib_deps =
    fastled/FastLED@^3.7.0
build_flags =
    ; Serial lewat port USB-C (bukan pin UART), wajib untuk C3 DevKit
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
